idth="25.70" height="6" rx="3" fill="#e34c26" style="animation-delay:0.47s"/><g class="fade" style="animation-delay:0.44s"><circle cx="445" cy="125" r="5" fill="#3572A5"/><text x="458" y="130" font-size="14" font-weight="500">Python</text><text class="mono muted" x="808" y="130" font-size="12.5" text-anchor="end">2.7%</text><rect x="440" y="140" width="368" height="6" rx="3" fill="#21262d"/></g><rect class="grow" x="440" y="140" width="11.36" height="6" rx="3" fill="#3572A5" style="animation-delay:0.54s"/><g class="fade" style="animation-delay:0.51s"><circle cx="445" cy="171" r="5" fill="#f1e05a"/><text x="458" y="176" font-size="14" font-weight="500">JavaScript</text><text class="mono muted" x="808" y="176" font-size="12.5" text-anchor="end">1.9%</text><rect x="440" y="186" width="368" height="6" rx="3" fill="#21262d"/></g><rect class="grow" x="440" y="186" width="8.00" height="6" rx="3" fill="#f1e05a" style="animation-delay:0.61s"/></svg>