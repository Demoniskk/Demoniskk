an style="fill:#a371f7">Go"</tspan><tspan class="muted">,</tspan> <tspan style="fill:#a371f7">"</tspan><tspan style="fill:#a371f7">Python"</tspan><tspan class="muted">,</tspan> <tspan style="fill:#a371f7">"</tspan><tspan style="fill:#a371f7">JavaScript"</tspan><tspan class="muted">]</tspan></text></g><g class="fade" style="animation-delay:1.78s"><text class="mono t" x="32" y="200" style="fill:#ff4d6d">runs_on</text><text class="mono t muted" x="99.2" y="200">=</text><text class="mono t" x="116.0" y="200"><tspan style="fill:#a371f7">"</tspan><tspan style="fill:#a371f7">GitHub Actions crons + static pages, zero servers"</tspan></text></g><g class="fade" style="animation-delay:1.90s"><text class="mono t" x="32" y="227" style="fill:#ff4d6d">latest</text><text class="mono t muted" x="99.2" y="227">=</text><text class="mono t" x="116.0" y="227"><tspan style="fill:#a371f7">"</tspan><tspan style="fill:#a371f7">RSS feeds for every podcast on NRK Radio"</tspan></text></g><g class="fade" style="animation-delay:2.02s"><text class="mono t" x="32" y="254" style="fill:#ff4d6d">tinkers</text><text class="mono t muted" x="99.2" y="254">=</text><text class="mono t" x="116.0" y="254"><tspan class="muted">[</tspan><tspan style="fill:#a371f7">"</tspan><tspan style="fill:#a371f7">Discord mods"</tspan><tspan class="muted">,</tspan> <tspan style="fill:#a371f7">"</tspan><tspan style="fill:#a371f7">CS2 stats"</tspan><tspan class="muted">,</tspan> <tspan style="fill:#a371f7">"</tspan><tspan style="fill:#a371f7">Switch homebrew"</tspan><tspan class="muted">]</tspan></text></g><g class="fade" style="animation-delay:2.14s"><text class="mono t" x="32" y="281" style="fill:#ff4d6d">motto</text><text class="mono t muted" x="99.2" y="281">=</text><text class="mono t" x="116.0" y="281"><tspan style="fill:#a371f7">"</tspan><tspan style="fill:#a371f7">if it&#39;s annoying, automate it"</tspan></text></g><g class="fade" style="animation-delay:2.36s"><text class="mono t" x="32" y="308" style="fill:url(#accent)" font-weight="700">❯</text><rect class="cursor" x="52" y="295" width="8" height="17" rx="1" fill="#ff4d6d"/></g></svg>