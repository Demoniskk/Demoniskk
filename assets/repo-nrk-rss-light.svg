<svg xmlns="http://www.w3.org/2000/svg" width="412" height="150" viewBox="0 0 412 150" fill="none" role="img" aria-label="nrk-rss"><title>nrk-rss</title><defs><clipPath id="box"><rect x="1" y="1" width="410" height="148" rx="5.5"/></clipPath></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}
