<svg xmlns="http://www.w3.org/2000/svg" width="840" height="268" viewBox="0 0 840 268" fill="none" role="img" aria-label="Demoniskk on GitHub"><title>Demoniskk on GitHub</title><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d6d"/><stop offset="1" stop-color="#a371f7"/></linearGradient><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient><radialGradient id="glow1"><stop offset="0" stop-color="#ff4d6d" stop-opacity="0.22"/><stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/></radialGradient><radialGradient id="glow2"><stop offset="0" stop-color="#a371f7" stop-opacity="0.22"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4d6d" stop-opacity="0"/><stop offset=".25" stop-color="#ff4d6d"/><stop offset=".75" stop-color="#a371f7"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></linearGradient><linearGradient id="spark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8d96a0" fill-opacity=".22"/></pattern><clipPath id="frame"><rect width="840" height="268" rx="16"/></clipPath></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#e6edf3}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.muted{fill:#8d96a0}
.title{font-size:18px;font-weight:600}
.sub{font-size:12px}
.label{font-size:10.5px;font-weight:600;letter-spacing:1.3px}
.fade{animation:fade .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.drift{animation:drift 16s ease-in-out infinite alternate}
.drift2{animation:drift 21s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-90px,30px)}}
.spark{animation:spark 7s ease-in-out 1s infinite}
@keyframes spark{0%{transform:translateX(0)}55%,100%{transform:translateX(1020px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.orbit{transform-origin:130px 134px;animation:spin 18s linear infinite}
.orbit2{transform-origin:130px 134px;animation:spin 40s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.name{font-size:34px;font-weight:800;letter-spacing:-.6px}</style><g clip-path="url(#frame)"><rect width="840" height="268" fill="url(#surface)"/><rect width="840" height="268" fill="url(#dots)"/><circle class="drift" cx="720" cy="-30" r="280" fill="url(#glow1)"/><circle class="drift2" cx="40" cy="308" r="240" fill="url(#glow2)"/><rect width="840" height="2" fill="url(#edge)"/><rect class="spark" x="-180" width="180" height="2" fill="url(#spark)"/></g><rect x=".5" y=".5" width="839" height="267" rx="15.5" stroke="#30363d"/><circle class="pulse" cx="130" cy="134" r="108" fill="url(#glow1)"/><circle class="orbit2" cx="130" cy="134" r="94" stroke="#8d96a0" stroke-opacity=".6" stroke-dasharray="1.5 7" stroke-linecap="round"/><circle class="orbit" cx="130" cy="134" r="84" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="118 46 30 46"/><clipPath id="av"><circle cx="130" cy="134" r="74"/></clipPath><image href="data:image/png;base64," x="56" y="60" width="148" height="148" clip-path="url(#av)" preserveAspectRatio="xMidYMid slice"/><circle cx="130" cy="134" r="74" stroke="#30363d" stroke-width="2"/><text class="name fade" x="252" y="88" style="fill:url(#accent)">Demoniskk</text><text class="mono muted fade" x="252" y="115" font-size="13" style="animation-delay:0.10s">@Demoniskk  ·  since 2020</text><text class="fade" x="252" y="146" font-size="15" opacity=".92" style="animation-delay:0.20s">31 contributions in the last year across 4 repositories.</text><rect class="grow" x="252" y="182" width="556" height="1" fill="#30363d" style="animation-delay:0.30s"/><g class="fade" style="animation-delay:0.35s"><text x="252" y="224" font-size="22" font-weight="700">26</text><rect x="252" y="237" width="10" height="2" rx="1" fill="url(#accent)"/><text class="label muted" x="268" y="241">COMMITS</text></g><g class="fade" style="animation-delay:0.43s"><text x="363" y="224" font-size="22" font-weight="700">0</text><rect x="363" y="237" width="10" height="2" rx="1" fill="url(#accent)"/><text class="label muted" x="379" y="241">STARS</text></g><g class="fade" style="animation-delay:0.51s"><text x="474" y="224" font-size="22" font-weight="700">3</text><rect x="474" y="237" width="10" height="2" rx="1" fill="url(#accent)"/><text class="label muted" x="490" y="241">PULL REQS</text></g><g class="fade" style="animation-delay:0.59s"><text x="585" y="224" font-size="22" font-weight="700">0</text><rect x="585" y="237" width="10" height="2" rx="1" fill="url(#accent)"/><text class="label muted" x="601" y="241">FOLLOWERS</text></g><g class="fade" style="animation-delay:0.67s"><text x="696" y="224" font-size="22" font-weight="700">4</text><rect x="696" y="237" width="10" height="2" rx="1" fill="url(#accent)"/><text class="label muted" x="712" y="241">REPOS</text></g><g class="fade" style="animation-delay:0.50s"><rect x="620" y="24" width="192" height="26" rx="13" fill="#0d1117" fill-opacity=".7" stroke="#30363d"/><circle class="pulse" cx="636" cy="37" r="7" fill="#3fb950" fill-opacity=".25"/><circle cx="636" cy="37" r="3.5" fill="#3fb950"/><text class="mono" x="648" y="41" font-size="12">building things in Go</text></g></svg>