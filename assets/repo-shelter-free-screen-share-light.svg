<svg xmlns="http://www.w3.org/2000/svg" width="412" height="164" viewBox="0 0 412 164" fill="none" role="img" aria-label="shelter-free-screen-share"><title>shelter-free-screen-share</title><defs><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d6d"/><stop offset="1" stop-color="#a371f7"/></linearGradient><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient><radialGradient id="glow1"><stop offset="0" stop-color="#ff4d6d" stop-opacity="0.14"/><stop offset="1" stop-color="#ff4d6d" stop-opacity="0"/></radialGradient><radialGradient id="glow2"><stop offset="0" stop-color="#a371f7" stop-opacity="0.14"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient><linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4d6d" stop-opacity="0"/><stop offset=".25" stop-color="#ff4d6d"/><stop offset=".75" stop-color="#a371f7"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></linearGradient><linearGradient id="spark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#59636e" fill-opacity=".22"/></pattern><clipPath id="frame"><rect width="412" height="164" rx="16"/></clipPath></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.muted{fill:#59636e}
.title{font-size:18px;font-weight:600}
.sub{font-size:12px}
.label{font-size:10.5px;font-weight:600;letter-spacing:1.3px}
.fade{animation:fade .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.drift{animation:drift 16s ease-in-out infinite alternate}
.drift2{animation:drift 21s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-90px,30px)}}
.spark{animation:spark 7s ease-in-out 1s infinite}
@keyframes spark{0%{transform:translateX(0)}55%,100%{transform:translateX(592px)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.rname{font-size:17px;font-weight:700;letter-spacing:-.2px}
.arrow{fill:url(#accent)}</style><g clip-path="url(#frame)"><rect width="412" height="164" fill="url(#surface)"/><rect width="412" height="164" fill="url(#dots)"/><circle class="drift" cx="354" cy="-30" r="150" fill="url(#glow1)"/><circle class="drift2" cx="40" cy="204" r="130" fill="url(#glow2)"/><rect width="412" height="2" fill="url(#edge)"/><rect class="spark" x="-180" width="180" height="2" fill="url(#spark)"/></g><rect x=".5" y=".5" width="411" height="163" rx="15.5" stroke="#d0d7de"/><text class="mono muted fade" x="24" y="34" font-size="11.5">demoniskk /</text><text class="rname fade" x="24" y="56" style="animation-delay:0.05s">shelter-free-screen-share</text><text class="arrow fade" x="388" y="42" font-size="18" text-anchor="end" style="animation-delay:0.10s">↗</text><text class="fade" x="24" y="82" font-size="13" opacity=".8" style="animation-delay:0.15s">Shelter plugin that unlocks all Discord screen share</text><text class="fade" x="24" y="101" font-size="13" opacity=".8" style="animation-delay:0.20s">quality presets (resolution/FPS) without Nitro</text><g class="fade" style="animation-delay:0.35s"><circle cx="29.0" cy="140" r="5" fill="#f1e05a"/><text x="40.0" y="144" font-size="12" class="muted">JavaScript</text><text x="126.0" y="144" font-size="12" class="muted">★ 0</text><circle class="pulse" cx="169.0" cy="140" r="3.5" fill="#3fb950"/><text class="mono muted" x="388" y="144" font-size="11.5" text-anchor="end">demoniskk.github.io/shelter-f…</text></g></svg>