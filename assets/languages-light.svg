<svg xmlns="http://www.w3.org/2000/svg" width="840" height="194" viewBox="0 0 840 194" fill="none" role="img" aria-label="Most used languages"><title>Most used languages</title><defs><clipPath id="box"><rect x="1" y="1" width="838" height="192" rx="5.5"/></clipPath></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;fill:#1f2328}
.mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.muted{fill:#59636e}
.accent{fill:#e5534b}
.label{font-size:11px;font-weight:600;letter-spacing:.8px}
.fade{animation:fade .6s ease-out both}
@keyframes fade{from{opacity:0}}
.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
