o muted" x="820" y="112" font-size="12.5" text-anchor="end">2.6%</text><rect x="440" y="122" width="380" height="4" rx="2" fill="#eff2f5"/></g><rect class="grow" x="440" y="122" width="11.24" height="4" rx="2" fill="#3572A5" style="animation-delay:0.54s"/><g class="fade" style="animation-delay:0.51s"><circle cx="445" cy="151" r="4.5" fill="#f1e05a"/><text x="458" y="156" font-size="14" font-weight="600">JavaScript</text><text class="mono muted" x="820" y="156" font-size="12.5" text-anchor="end">1.9%</text><rect x="440" y="166" width="380" height="4" rx="2" fill="#eff2f5"/></g><rect class="grow" x="440" y="166" width="7.92" height="4" rx="2" fill="#f1e05a" style="animation-delay:0.61s"/></svg>