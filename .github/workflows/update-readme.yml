name: Update profile README

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "config.json"
      - "templates/**"
      - ".github/workflows/update-readme.yml"

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate README and cards
        run: go run .
        env:
          # Optional PAT for private contributions/repos; falls back to the built-in token.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit changes
        run: |
          git add README.md assets
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile stats"
          git push
